constants:

    # Project & Hostname
    project: project_domain
    group: group_server
    hostname: hostname_server
    
    # Database credentials
    postgres_user: postgres_user
    postgres_password: postgres_password

    # Servers
    user_1: user_1
    server_1: server_or_ip_1
    port_1: port_1
    
    user_2: user_2
    server_2: server_or_ip_2
    port_2: port_2

# List of source directories and files to back up
source_directories:
    - /var/www/{project}

exclude_patterns:
    - '*.o'
    - '*.log'
    - '*.tmp'
    - '*.cache'
    - '*.git'

archive_name_format: '{project}_site-files-{now:%Y-%m-%dT%H:%M:%S}'

# Retention policy
keep_monthly: 6
keep_yearly: 1

checks:
    - name: archives
    - name: repository
      frequency: 2 weeks

check_last: 3

# Command hooks (borgmatic >= 1.9 syntax; the old before_backup/after_backup/
# on_error sections are deprecated and warn on every run).
commands:
    - before: action
      when:
        - create
      run:
        - pg_dumpall -U {postgres_user} -W{postgres_password} --clean > /tmp/{project}_backup.sql
    - after: action
      when:
        - create
      run:
        - rm -f /tmp/{project}_backup.sql
    # Plain command only: borgmatic runs hooks under /bin/sh without brolit's libs,
    # so send_notification is not defined there (it failed with exit 127 and hid
    # the real reason). brolit already emails the failure itself.
    - after: error
      run:
        - echo "Borgmatic failed for {project}; see the brolit backup log for the classified reason"

postgresql_databases:
    # Quoted -- an unquoted bare "{name}" is valid YAML flow-mapping syntax
    # for the whole value (a mapping with key "name" and a null value), not
    # a plain string. yq re-serializes the file on every `-i` call in
    # generate_borg_config(), and silently rewrites an unquoted `{database}`
    # here into `{database: ''}` the first time it does -- confirmed live.
    - name: "{database}"
      username: "{postgres_user}"
      password: "{postgres_password}"
      format: plain
      options: --no-tablespaces
