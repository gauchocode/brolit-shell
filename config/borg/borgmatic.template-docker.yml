constants:

    # Project & Hostname
    project: project_domain
    group: group_server
    hostname: hostname_server

    # Servers
    user_1: user_1
    server_1: server_or_ip_1
    port_1: port_1
    
    user_2: user_2
    server_2: server_or_ip_2
    port_2: port_2

# List of source directories and files to back up
source_directories:
    - /var/www/{project}

exclude_patterns:
    - '*.o'
    - '*.log'
    - '*.tmp'
    - '*.cache'
    - '*.git'

archive_name_format: '{project}_site-files-{now:%Y-%m-%dT%H:%M:%S}'

# Retention policy
keep_monthly: 6
keep_yearly: 1

checks:
    - name: archives
    - name: repository
      frequency: 2 weeks

check_last: 3

# Backup hooks
# NOTE: docker compose pause/unpause hooks used to live here. They froze the
# whole stack for the entire backup (twice per night: the per-project pass
# and the global pass) and any interruption between the hooks — the cron
# timeout, a crashed borgmatic, a failed compose call — left the containers
# paused indefinitely. Database consistency is already handled by the
# database dumps, so the site freeze bought nothing and risked everything.
# Command hooks (borgmatic >= 1.9 syntax; the old before_backup/after_backup/
# on_error sections are deprecated and warn on every run).
# sanitize_borgmatic_pause_hooks() strips them from existing configs too.
# Log collection is ancillary: it must never turn a completed backup into a
# failure. Non-Docker projects have no compose file, and `docker compose logs`
# used to abort the whole config with "no such file or directory" even though
# the archive had been created.
commands:
    - after: action
      when:
        - create
      run:
        - compose=/var/www/{project}/docker-compose.yml; if [ -f "$compose" ]; then docker compose -f "$compose" logs -t > /var/log/{project}_docker.log 2>/dev/null || true; fi
    # The on_error hook runs under /bin/sh without brolit's libs sourced, so it
    # must be a plain command. `send_notification` only exists inside brolit and
    # made every failing backup end with "not found" (exit 127) instead of the
    # real reason; brolit already sends its own email for the same failure.
    - after: error
      run:
        - echo "Borgmatic failed for {project}; see the brolit backup log for the classified reason"
