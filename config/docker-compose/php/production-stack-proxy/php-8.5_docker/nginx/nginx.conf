server {

    listen 80 default;

    # REAL IP : Restore real visitor IP from host reverse-proxy.
    # The host sets X-Real-IP to the real client IP (restored from
    # CF-Connecting-IP when behind Cloudflare). Trust only private nets.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    client_max_body_size 108M;
    keepalive_timeout 90;
    send_timeout 300;

    access_log /var/log/nginx/application.access.log;

    root /application/public;

    index index.php;

    # try to serve file directly, fallback to index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    if (!-e $request_filename) {
        rewrite ^.*$ /index.php last;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/application.errors.log";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }

    ## INC
    #include /application/nginx.conf;

}
